<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1b563d">
  <meta name="description" content="Alle matoppskriftene samlet på ett sted. Finn en rett, se bildet og åpne oppskriften.">
  <title>Matoppskrifter – alle oppskrifter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    body.recipe-library {background:#fafbf8;color:#20382b}
    .recipe-library .site-header {border-bottom:1px solid #e4e9e1}
    .recipe-library .header-inner {min-height:84px}
    .recipe-library .brand__name {font-size:30px}
    .library-intro {padding:83px 0 46px;max-width:800px}
    .library-intro h1 {font:600 clamp(43px,6vw,72px)/1.14 "Fraunces",Georgia,serif;letter-spacing:-.045em;color:#173f2f;margin:13px 0 18px}
    .library-intro p:last-child {font-size:16px;line-height:1.75;color:#617567;max-width:570px;margin:0}
    .library-list {padding-bottom:108px}
    .library-grid {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:25px}
    .library-card {display:block;background:#fff;border:1px solid #e4eae3;border-radius:13px;overflow:hidden;color:inherit;text-decoration:none;box-shadow:0 8px 28px rgba(18,61,45,.055);transition:transform .2s ease,box-shadow .2s ease}
    .library-card:hover {transform:translateY(-4px);box-shadow:0 16px 34px rgba(18,61,45,.12)}
    .library-card:focus-visible {outline:3px solid #7ab06d;outline-offset:4px}
    .library-card__photo {display:block;width:100%;aspect-ratio:4/4.3;object-fit:cover;object-position:center;background:#e4eadf}
    .library-card__photo--chicken {object-position:center 52%}
    .library-card__body {padding:23px 23px 27px}
    .library-card__title {font:600 clamp(21px,2.4vw,28px)/1.25 "Fraunces",Georgia,serif;letter-spacing:-.03em;color:#173f2f;margin:0}
    .library-card:hover .library-card__title {color:#276e4c}
    .library-footer {border-top:1px solid #e4eae3;padding:28px 0;color:#78867b;background:#fff;font-size:12px}
    @media (max-width:860px) {.library-grid {grid-template-columns:repeat(2,minmax(0,1fr))}.library-intro {padding:62px 0 38px}.library-list {padding-bottom:76px}}
    @media (max-width:580px) {.recipe-library .header-inner {min-height:72px}.recipe-library .brand__name {font-size:25px}.library-intro {padding:49px 0 31px}.library-intro h1 {font-size:clamp(38px,10vw,52px)}.library-intro p:last-child {font-size:14px}.library-grid {grid-template-columns:1fr;gap:19px}.library-card__photo {aspect-ratio:5/4}.library-card__body {padding:20px}.library-list {padding-bottom:57px}}
    @media (prefers-reduced-motion:reduce){.library-card{transition:none}}
  </style>
</head>
<body class="recipe-library">
  <a class="skip-link" href="#oppskrifter">Hopp til oppskriftene</a>
  <header class="site-header">
    <div class="header-inner container"><a class="brand" href="index.html" aria-label="Matoppskrifter – hjem"><span class="brand__name">Matoppskrifter</span></a></div>
  </header>
  <main class="container" id="oppskrifter">
    <section class="library-intro" aria-labelledby="library-title">
      <p class="section-kicker">ALLE OPPSKRIFTER</p>
      <h1 id="library-title">Hva skal vi lage i dag?</h1>
      <p>Velg en rett for å se ingredienser og fremgangsmåte.</p>
    </section>
    <section class="library-list" aria-label="Oppskriftsoversikt">
      <div class="library-grid">
        <a class="library-card" href="chicken-delight.html">
          <img class="library-card__photo library-card__photo--chicken" src="images/chicken-delight.avif" width="480" height="516" alt="Stekt kylling med søtpotet og grønnkål" fetchpriority="high">
          <div class="library-card__body"><h2 class="library-card__title">Chicken Delight</h2></div>
        </a>
        <a class="library-card" href="lasagne.html">
          <img class="library-card__photo" src="https://images.unsplash.com/photo-1574894709920-11b28e7367e3?auto=format&amp;fit=crop&amp;w=900&amp;q=85" width="480" height="516" alt="Hjemmelaget lasagne med gyllen ost" loading="lazy" decoding="async">
          <div class="library-card__body"><h2 class="library-card__title">Hjemmelaget lasagne</h2></div>
        </a>
        <a class="library-card" href="sotpotetgryte.html">
          <img class="library-card__photo" src="https://unsplash.com/photos/brPldWJ0jBQ/download?force=true&amp;w=900" width="480" height="516" alt="Fargerik rett med søtpotet og grønnsaker" loading="lazy" decoding="async" onerror="this.onerror=null;this.src='https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&amp;fit=crop&amp;w=900&amp;q=85'">
          <div class="library-card__body"><h2 class="library-card__title">Krydret søtpotetgryte</h2></div>
        </a>
      </div>
    </section>
  </main>
  <footer class="library-footer"><div class="container">Matoppskrifter – laget med matglede.</div></footer>
</body>
</html>
